<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的專屬邀請函</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Serif TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', serif;
            background-color: #f7f5f0;
            color: #2c2c2c;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Noto Serif TC', serif;
        }
        /* 紙張質感陰影 */
        .paper-shadow {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-100 selection:text-amber-900">

    <!-- 背景裝飾光暈 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-40">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-200 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-stone-300 rounded-full blur-3xl"></div>
    </div>

    <!-- 主容器 -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8">

        <!-- 階段一：封面 / 信封互動區 -->
        <div id="cover-section" class="w-full max-w-md bg-white rounded-3xl paper-shadow p-8 sm:p-10 text-center transition-all duration-700 ease-in-out border border-stone-100">
            <div class="w-20 h-20 mx-auto mb-6 bg-amber-50 text-amber-700 rounded-2xl flex items-center justify-center text-3xl shadow-inner floating">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <span class="inline-block px-3 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full tracking-wider mb-3">EXCLUSIVE INVITATION</span>
            <h1 class="serif-font text-2xl sm:text-3xl font-bold text-stone-800 mb-2">誠摯邀請您的蒞臨</h1>
            <p class="text-stone-500 text-sm sm:text-base mb-8 leading-relaxed">您有一份來自重要時刻的專屬邀請函，請點擊下方按鈕開啟。</p>
            
            <button onclick="openInvitation()" class="w-full py-4 px-6 bg-stone-900 hover:bg-amber-800 text-white font-medium rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center space-x-3 group cursor-pointer">
                <span>開啟你的專屬邀請函</span>
                <i class="fa-solid fa-arrow-right-long transition-transform duration-300 group-hover:translate-x-1"></i>
            </button>
            <p class="text-xs text-stone-400 mt-6">建議在穩定網路與良好音效環境下檢視</p>
        </div>

        <!-- 階段二：PDF 邀請函內容與檢視器 (預設隱藏) -->
        <div id="invitation-section" class="w-full max-w-4xl bg-white rounded-3xl paper-shadow p-6 sm:p-10 hidden opacity-0 transition-all duration-1000 transform translate-y-8 border border-stone-100">
            <!-- 頂部導航列 -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-stone-100 pb-5 mb-6 gap-4">
                <div>
                    <span class="text-xs font-bold text-amber-700 tracking-widest uppercase">Official Document</span>
                    <h2 class="serif-font text-xl sm:text-2xl font-bold text-stone-800">您的專屬電子邀請函</h2>
                </div>
                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                    <button onclick="togglePreview()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 text-sm font-medium rounded-xl transition flex items-center space-x-2 cursor-pointer">
                        <i class="fa-regular fa-eye"></i>
                        <span id="preview-btn-text">全螢幕預覽</span>
                    </button>
                    <a href="https://drive.google.com/file/d/1aZd_wTrOQIsAutIK7NmiTUq7Slw6ynWB/view?usp=sharing" target="_blank" class="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white text-sm font-medium rounded-xl transition shadow-md flex items-center space-x-2">
                        <i class="fa-solid fa-download"></i>
                        <span>下載 PDF</span>
                    </a>
                </div>
            </div>

            <!-- PDF 嵌入容器 (對應指定的 Google Drive 預覽連結) -->
            <div id="pdf-container" class="bg-stone-50 border-2 border-dashed border-stone-200 rounded-2xl p-4 sm:p-6 relative transition-all duration-300">
                <div class="w-full h-[65vh] sm:h-[75vh] rounded-xl overflow-hidden shadow-inner border border-stone-200 bg-white">
                    <iframe 
                        src="https://drive.google.com/file/d/1aZd_wTrOQIsAutIK7NmiTUq7Slw6ynWB/preview" 
                        class="w-full h-full border-0"
                        allow="autoplay"
                        title="專屬邀請函 PDF">
                    </iframe>
                </div>
            </div>

            <!-- 底部回覆按鈕群 -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                <button onclick="rsvpResponse('accept')" class="w-full sm:w-auto px-8 py-3 bg-stone-900 hover:bg-stone-800 text-white font-medium rounded-xl shadow transition cursor-pointer">
                    <i class="fa-solid fa-check mr-2 text-amber-400"></i>我將準時出席
                </button>
                <button onclick="rsvpResponse('decline')" class="w-full sm:w-auto px-6 py-3 bg-white hover:bg-stone-50 text-stone-600 border border-stone-200 font-medium rounded-xl transition cursor-pointer">
                    不克出席
                </button>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="relative z-10 text-center py-6 text-xs text-stone-400">
        <p>&copy; 2026 Invitation System. All rights reserved.</p>
    </footer>

    <!-- 提示訊息彈窗 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-stone-900 text-white px-6 py-3 rounded-2xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-amber-400"></i>
        <span id="toast-message" class="text-sm">訊息提示</span>
    </div>

    <!-- JavaScript 互動邏輯 -->
    <script>
        function openInvitation() {
            const cover = document.getElementById('cover-section');
            const invitation = document.getElementById('invitation-section');

            // 封面淡出滑動效果
            cover.style.opacity = '0';
            cover.style.transform = 'translateY(-20px)';

            setTimeout(() => {
                cover.classList.add('hidden');
                invitation.classList.remove('hidden');
                
                // 強制瀏覽器重繪以觸發淡入動畫
                void invitation.offsetWidth;
                
                invitation.style.opacity = '1';
                invitation.style.transform = 'translateY(0)';
            }, 400);
        }

        let isFullscreen = false;
        function togglePreview() {
            const container = document.getElementById('pdf-container');
            const btnText = document.getElementById('preview-btn-text');
            
            isFullscreen = !isFullscreen;
            if (isFullscreen) {
                container.classList.add('fixed', 'inset-4', 'z-50', 'bg-stone-900/90', 'backdrop-blur-sm', 'p-4', 'overflow-y-auto', 'border-2', 'border-amber-700');
                btnText.innerText = '關閉預覽';
                showToast('已進入全螢幕檢視模式', 'info');
            } else {
                container.classList.remove('fixed', 'inset-4', 'z-50', 'bg-stone-900/90', 'backdrop-blur-sm', 'p-4', 'overflow-y-auto', 'border-2', 'border-amber-700');
                btnText.innerText = '全螢幕預覽';
            }
        }

        function rsvpResponse(status) {
            if (status === 'accept') {
                showToast('感謝您的回覆！已成功登記「出席」。', 'success');
            } else {
                showToast('已收到您的回覆，感謝您的告知。', 'info');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.innerText = message;
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-amber-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }
    </script>
</body>
</html>
